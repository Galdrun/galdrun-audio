[General]
Name = Galdrun Connector 3
# Audio/video major class, loudspeaker minor class (as the stock Streamer).
Class = 0x000414
DiscoverableTimeout = 120
PairableTimeout = 120
JustWorksRepairing = always
# Keep unpaired devices a search found for 5 min, so one picked from the
# settings page's list later can still be paired.
TemporaryTimeout = 300

[Policy]
AutoEnable = true
