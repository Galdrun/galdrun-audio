# Time from the LAN only, never an Internet pool: galdrun-time-sources writes
# the router (from DHCP or the static gateway) and, as fallback, the Galdrun
# server's host here.
sourcedir /run/chrony-sources
driftfile /run/chrony/drift
# CLOCK_MONOTONIC also follows NTP slewing. Step RTC errors at startup;
# bound later corrections so the audio and MATP clock fits remain usable.
makestep 0.001 3
maxslewrate 50
rtcsync
