# The server image's time: unlike the client appliances it may reach the
# Internet, and its core hands this time to them (SNTP on UDP 4721), so it
# needs a real source. The router first when it serves time (DHCP or static
# gateway via galdrun-time-sources), else the public pool.
sourcedir /run/chrony-sources
pool pool.ntp.org iburst
driftfile /run/chrony/drift
# CLOCK_MONOTONIC also follows NTP slewing. Step RTC errors at startup;
# bound later corrections so the audio and MATP clock fits remain usable.
makestep 0.001 3
maxslewrate 50
rtcsync
