image boot.vfat {
    vfat {
        file config.txt { image = "rpi-boot/config.txt" }
        file cmdline.txt { image = "rpi-boot/cmdline.txt" }
        file galdrun-audio.txt { image = "rpi-boot/galdrun-audio.txt" }
        file bootcode.bin { image = "rpi-boot/bootcode.bin" }
        file start.elf { image = "rpi-boot/start.elf" }
        file fixup.dat { image = "rpi-boot/fixup.dat" }
        file zImage { image = "rpi-boot/zImage" }
        file overlays { image = "rpi-boot/overlays" }
        #DTBS#
    }
    size = 64M
}
image sdcard.img {
    hdimage { }
    partition boot {
        partition-type = 0xC
        bootable = true
        offset = 1M
        image = "boot.vfat"
    }
    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}
