image boot.vfat {
    vfat {
        file config.txt { image = "rpi-boot/config.txt" }
        file cmdline.txt { image = "rpi-boot/cmdline.txt" }
        file galdrun-audio.txt { image = "rpi-boot/galdrun-audio.txt" }
        #FIRMWARE#
        file #KERNEL# { image = "rpi-boot/#KERNEL#" }
        file overlays { image = "rpi-boot/overlays" }
        #DTBS#
    }
    size = 64M
}
image sdcard.img {
    hdimage { }
    partition boot {
        partition-type = 0xC
        bootable = true
        offset = 1M
        image = "boot.vfat"
    }
    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }
}
