<section id="networkBox" class="settings-card hidden" aria-labelledby="card-wi-fi">
  <div class="card-intro"><div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8 16a6 6 0 0 1 8 0"/><circle cx="12" cy="20" r="1"/></svg></div><div><h2 id="card-wi-fi" tabindex="-1" data-i18n="wifi.wiFi"></h2><p data-i18n="wifi.connectToYour"></p></div></div>
  <div class="card-content fields">
    <div id="wifiRadioBox" class="field-group hidden"><label for="wifiRadio" data-i18n="wifi.wiFiRadio"></label><select id="wifiRadio"><option value="" data-i18n="common.automatic"></option></select><p id="wifiRadioHint" class="hint"></p></div>
    <label for="wifiSsid" data-i18n="wifi.network"></label>
    <div class="row"><input id="wifiSsid" maxlength="32" autocomplete="off"><button type="button" id="wifiScan" data-i18n="wifi.scan"></button></div>
    <div id="wifiNetworks" class="nets"></div>
    <label for="wifiPassword" data-i18n="wifi.password"></label>
    <div class="row"><input id="wifiPassword" type="password" autocomplete="new-password"><button type="button" id="wifiEye" data-i18n-aria-label="wifi.showPasswordWhile" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <label for="wifiAp" data-i18n="wifi.accessPoint"></label>
    <select id="wifiAp"></select>
    <p class="hint" data-i18n="wifi.scanToList"></p>
    <details id="wifiAdvanced" class="hidden" style="grid-column:1 / -1"><summary data-i18n="wifi.advancedWiFi"></summary><div class="fields">
      <label for="wifiCountry" data-i18n="wifi.country"></label><input id="wifiCountry" maxlength="2" pattern="[A-Z]{2}" autocomplete="off" placeholder="AT">

      <p class="hint" data-i18n="wifi.ethernetTakesPrecedence"></p>
    </div></details>
    <div id="wifiChart" class="wifi-chart" data-i18n-aria-label="wifi.wiFiSignal"></div>
  </div>
</section>

<section id="ethAddressBox" class="settings-card hidden" aria-labelledby="card-eth-address">
  <div class="card-intro"><div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="6" rx="2"/><rect x="2" y="16" width="6" height="6" rx="2"/><rect x="16" y="16" width="6" height="6" rx="2"/><path d="M12 8v4M5 16v-4h14v4"/></svg></div><div><h2 id="card-eth-address" tabindex="-1" data-i18n="ethernet.ethernetAddress"></h2><p data-i18n="ethernet.configureEthernetIp"></p></div></div>

    <label for="ethMode" data-i18n="ethernet.ipAddress"></label>
    <select id="ethMode"><option value="dhcp" data-i18n="ethernet.automaticDhcp"></option><option value="static" data-i18n="ethernet.static"></option></select>
    <label for="ethSpeed" data-i18n="ethernet.linkSpeed"></label><select id="ethSpeed"><option value="auto" data-i18n="ethernet.automatic10100"></option><option value="10" data-i18n="ethernet.10Mbps"></option><option value="100" data-i18n="ethernet.100Mbps"></option></select>
    <div id="ethStatic" class="field-group">
      <label for="ethIp" data-i18n="ethernet.address"></label><input id="ethIp" placeholder="192.168.1.50" inputmode="decimal" autocomplete="off">
      <label for="ethMask" data-i18n="ethernet.subnetMask"></label><input id="ethMask" placeholder="255.255.255.0" inputmode="decimal" autocomplete="off">
      <label for="ethGateway" data-i18n="ethernet.gatewayEmptyNone"></label><input id="ethGateway" placeholder="192.168.1.1" inputmode="decimal" autocomplete="off">
      <label for="ethDns" data-i18n="ethernet.dnsServerEmpty"></label><input id="ethDns" inputmode="decimal" autocomplete="off">
    </div>
    <p class="hint" id="ethNow"></p>
  </div>
</section>

<section id="wifiAddressBox" class="settings-card hidden" aria-labelledby="card-wifi-address">
  <div class="card-intro"><div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="6" rx="2"/><rect x="2" y="16" width="6" height="6" rx="2"/><rect x="16" y="16" width="6" height="6" rx="2"/><path d="M12 8v4M5 16v-4h14v4"/></svg></div><div><h2 id="card-wifi-address" tabindex="-1" data-i18n="wifiAddress.wiFiAddress"></h2><p data-i18n="wifiAddress.configureWiFi"></p></div></div>
  <div class="card-content fields">
    <label for="wifiMode" data-i18n="wifiAddress.ipAddress"></label>
    <select id="wifiMode"><option value="dhcp" data-i18n="wifiAddress.automaticDhcp"></option><option value="static" data-i18n="wifiAddress.static"></option></select>
    <div id="wifiStatic" class="field-group">
      <label for="wifiIp" data-i18n="wifiAddress.address"></label><input id="wifiIp" placeholder="192.168.1.50" inputmode="decimal" autocomplete="off">
      <label for="wifiMask" data-i18n="wifiAddress.subnetMask"></label><input id="wifiMask" placeholder="255.255.255.0" inputmode="decimal" autocomplete="off">
      <label for="wifiGateway" data-i18n="wifiAddress.gatewayEmptyNone"></label><input id="wifiGateway" placeholder="192.168.1.1" inputmode="decimal" autocomplete="off">
      <label for="wifiDns" data-i18n="wifiAddress.dnsServerEmpty"></label><input id="wifiDns" inputmode="decimal" autocomplete="off">
    </div>
    <p class="hint" id="wifiNow"></p>
  </div>
</section>

<section class="settings-card" aria-labelledby="card-client">
  <div class="card-intro"><div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="7" r="4"/><path d="M2 21v-3a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v3H2zM18 3a4 4 0 0 1 0 8M20 14a6 6 0 0 1 2 5"/></svg></div><div><h2 id="card-client" tabindex="-1" data-i18n="common.client"></h2><p data-i18n="client.setHowThis"></p></div></div>
  <div class="card-content fields">
    <label for="room" data-i18n="client.roomName"></label>
    <input id="room" maxlength="64" autocomplete="off" aria-describedby="roomHint">
    <p class="hint" id="roomHint" data-i18n="client.howServerLists"></p>
    <label for="clientId" data-i18n="client.clientId"></label>
    <div class="row"><input id="clientId" maxlength="64" required autocomplete="off" spellcheck="false" disabled aria-describedby="clientIdHint"><button type="button" id="editClientId" aria-controls="clientId" data-i18n="client.edit"></button></div>
    <p class="hint" id="clientIdHint" data-i18n="client.identityEveryServer"></p>
    <div id="deviceNameBox" class="field-group hidden">
      <label for="deviceName" data-i18n="client.deviceName"></label>
      <input id="deviceName" maxlength="31" pattern="[A-Za-z0-9](?:[A-Za-z0-9\-]{0,29}[A-Za-z0-9])?" autocomplete="off" spellcheck="false" aria-describedby="deviceNameHint" disabled>
      <p class="hint" id="deviceNameHint" data-i18n="client.itsNameOn"></p>
    </div>
    <label for="active" data-i18n="client.inTheSystem"></label>
    <select id="active" aria-describedby="activeHint"><option value="true" data-i18n="client.activeRoom"></option><option value="false" data-i18n="client.deactivated"></option></select>
    <p class="hint" id="activeHint" data-i18n="client.deactivatedHint"></p>
    <label for="server" data-i18n="client.serverHostPort"></label>
    <input id="server" placeholder="192.168.1.10:4711" autocomplete="off" aria-describedby="serverHint">
    <p class="hint" id="serverHint" data-i18n="client.addressOfYour"></p>
    <div id="audioProfileBox" class="field-group hidden">
      <label for="audioProfile" data-i18n="client.audioBoard"></label><select id="audioProfile" aria-describedby="audioProfileHint audioProfileHelp"></select>
      <p id="audioProfileHint" class="hint"></p>
      <p id="audioProfileHelp" class="hint" data-i18n="client.applyingChangedBoot"></p>
      <div class="row full-width" style="flex-wrap:wrap;justify-content:flex-end"><button type="button" id="audioProfileApply" data-i18n="client.applyProfile"></button><button type="button" id="audioProfileRollback" data-i18n="client.restorePreviousProfile"></button></div>
    </div>
    <label for="device" data-i18n="client.output"></label>
    <div class="row"><select id="device"></select><button type="button" id="rescan" class="hidden" data-i18n="client.rescan"></button></div>
    <div id="i2sClockBox" class="field-group hidden">
      <label for="clock" data-i18n="client.i2sClock"></label>
      <select id="clock"><option value="master" data-i18n="client.masterThisBoard"></option><option value="slave" data-i18n="client.slaveExternalClock"></option></select>
      <div id="rateRow" class="field-group"><label for="rate" data-i18n="client.externalClockRate"></label>
      <select id="rate"><option>44100</option><option>48000</option><option>88200</option><option>96000</option><option>176400</option><option>192000</option></select></div>
    </div>
  </div>
</section>

<section class="settings-card" aria-labelledby="card-audio">
  <div class="card-intro"><div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13M9 8l12-2"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="18" cy="16" rx="3" ry="3"/></svg></div><div><h2 id="card-audio" tabindex="-1" data-i18n="audio.audio"></h2><p data-i18n="audio.outputFormatsBuffering"></p></div></div>
  <div class="card-content">
    <div id="i2sAudioBox" class="fields hidden">
      <label for="buffer" data-i18n="audio.bufferTime"></label>
      <div class="unit-input"><input id="buffer" type="number" min="1000" max="11000" step="1" required disabled aria-describedby="bufferHint"><span>ms</span></div>
      <p class="hint" id="bufferHint" data-i18n="audio.1000To11000"></p>
      <div id="i2sFormatsLabel"><span class="field-label" data-i18n="audio.externalI2sDac"></span><p class="note" data-i18n="audio.formatsItPlays"></p></div>
      <div class="table-wrap"><table aria-labelledby="i2sFormatsLabel"><thead><tr><th scope="col" data-i18n="audio.rate"></th><th scope="col" data-i18n="audio.16Bit"></th><th scope="col" data-i18n="audio.32BitAnd"></th></tr></thead><tbody id="i2sFormats"></tbody></table></div>
      <p class="hint" data-i18n="audio.onlyFormatsWhose"></p>
      <span class="field-label" data-i18n="audio.onBoardCodec"></span>
      <p class="note" id="codecFormats"></p>
    </div>
    <div id="formatsBox" class="hidden">
      <h3 data-i18n="audio.availableOutputFormats"></h3><p class="hint" id="formatDevice" style="margin-bottom:16px"></p><dl id="audioFormats"></dl>
      <p id="audioFormatsEmpty" class="hidden" data-i18n="audio.noDirectHardware"></p>

    <div id="driftBox" class="hidden"><h3 data-i18n="audio.clockSynchronization"></h3><div class="fields"><label for="driftCorrection" data-i18n="audio.driftCorrection"></label><select id="driftCorrection" aria-describedby="driftHint driftNow"><option value="auto" data-i18n="common.automatic"></option><option value="resampling" data-i18n="audio.serverResampling"></option><option value="hardwareClock" data-i18n="audio.hardwareClock"></option></select><p class="hint" id="driftHint" data-i18n="audio.howThisRoom"></p><p class="hint" id="driftNow"></p></div></div>
    <div id="dacBox" class="hidden"><h3 id="dacName" data-i18n="audio.dacSettings"></h3><p class="hint" data-i18n="audio.saveAppliesChanged"></p><div id="dacControls" class="fields"></div><div class="row" style="margin-top:20px"><button type="button" id="dacReload" data-i18n="audio.reloadCurrentDac"></button><button type="button" id="dacReset" data-i18n="audio.resetDefaultDac"></button></div></div>
  </div>
</section>

<section id="cpuBox" class="settings-card hidden" aria-labelledby="card-cpu">
  <div class="card-intro"><div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/></svg></div><div><h2 id="card-cpu" tabindex="-1" data-i18n="cpu.cpu"></h2><p data-i18n="cpu.chooseProcessorSpeed"></p></div></div>

</section>

<section id="ledBox" class="settings-card hidden" aria-labelledby="card-leds">
  <div class="card-intro"><div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M8 14a6 6 0 1 1 8 0c-1 1-1 2-1 4H9c0-2 0-3-1-4z"/></svg></div><div><h2 id="card-leds" tabindex="-1" data-i18n="leds.leds"></h2><p data-i18n="leds.controlStatusLights"></p></div></div>
  <div class="card-content fields"><label for="ledOff" data-i18n="leds.ledMode"></label><select id="ledOff"><option value="false" data-i18n="leds.onLightsOn"></option><option value="true" data-i18n="leds.offLightsOff"></option></select><p class="hint" data-i18n="leds.bootAndFirmware"></p></div>

<section id="powerBox" class="settings-card hidden" aria-labelledby="card-power">
  <div class="card-intro"><div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10M6 5a9 9 0 1 0 12 0"/></svg></div><div><h2 id="card-power" tabindex="-1" data-i18n="common.power"></h2><p data-i18n="power.saveEnergyWhen"></p></div></div>

<section id="sshBox" class="settings-card hidden" aria-labelledby="card-ssh">
  <div class="card-intro"><div class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 9l3 3-3 3M12 15h5"/></svg></div><div><h2 id="card-ssh" tabindex="-1" data-i18n="ssh.remoteLoginSsh"></h2><p data-i18n-html="ssh.logInTo"></p></div></div>
