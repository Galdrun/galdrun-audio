<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page.title"></title>
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">

    <div class="header-tools">
      <span class="header-listener">
        <button type="button" id="listener" aria-haspopup="dialog" data-i18n-title="header.whoseLikesFavourites"><i data-icon="people"></i><small id="listenerName"></small></button>
        <div id="listenerPick" class="pick-popover" popover="auto" role="dialog" data-i18n-aria-label="header.listener"></div>
      </span>
      <span id="conn" class="conn-dot" role="status"></span>
      <div id="language" class="language" data-i18n-aria-label="nav.language"></div>
    </div>
  </div>
</header>

<div class="layout">
  <nav id="sidebar" class="sidebar" data-i18n-aria-label="nav.pages">
    <button type="button" id="navCollapse" class="nav-collapse" aria-controls="sidebar" aria-expanded="true" data-i18n-aria-label="nav.collapseMenu" data-i18n-title="nav.collapseMenu"><i data-icon="back"></i></button>
    <p class="nav-group" data-i18n="nav.control"></p>
    <a href="#/home"><i data-icon="home"></i><span data-i18n="nav.home"></span></a>
    <a href="#/zones"><i data-icon="zones"></i><span data-i18n="common.zones"></span></a>
    <a href="#/playlists"><i data-icon="playlists"></i><span data-i18n="common.playlists"></span></a>
    <a href="#/stations"><i data-icon="radio"></i><span data-i18n="nav.radioStations"></span></a>
    <a href="#/rooms"><i data-icon="device"></i><span data-i18n="common.clients"></span></a>
    <a href="#/assistant"><i data-icon="chat"></i><span data-i18n="nav.assistant"></span></a>

    <!-- These two groups fold up and down by their headings (kept per viewer). -->
    <button type="button" class="nav-group nav-group-toggle" data-group="settings" data-short="S" data-i18n-title="nav.settings" aria-controls="navSettings" aria-expanded="true"><span data-i18n="nav.settings"></span><i data-icon="forward"></i></button>
    <div id="navSettings" class="nav-links">
      <a href="#/settings"><i data-icon="setup"></i><span data-i18n="nav.settings"></span></a>
      <a href="#/folders"><i data-icon="folder"></i><span data-i18n="nav.musicLibrary"></span></a>
      <a href="#/services"><i data-icon="cloud"></i><span data-i18n="nav.onlineServices"></span></a>
      <a href="#/ai"><i data-icon="sparkle"></i><span data-i18n="nav.aiProviders"></span></a>
      <a href="#/listeners"><i data-icon="rooms"></i><span data-i18n="nav.listeners"></span></a>
    </div>

    <button type="button" class="nav-group nav-group-toggle" data-group="diagnostics" data-short="D" data-i18n-title="nav.diagnostics" aria-controls="navDiagnostics" aria-expanded="true"><span data-i18n="nav.diagnostics"></span><i data-icon="forward"></i></button>
    <div id="navDiagnostics" class="nav-links">
      <a href="#/aiStatus"><i data-icon="sparkle"></i><span data-i18n="common.ai"></span></a>
      <a href="#/activity"><i data-icon="log"></i><span data-i18n="nav.activity"></span></a>
    </div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>

  <main id="main" tabindex="-1">

<!-- ============================== CONTROL ============================== -->

    <!-- The start page: the zones at a glance, what was played, the
         favourites and likes, and what the AI proposes (renderHome). -->
    <section class="page page-wide" data-page="home" data-title="nav.home" hidden>
      <div id="home" class="home"></div>
    </section>

    <!-- A desktop-style page: the zones (swiped between) on the left, the
         library (sources tree and items) on the right, filling the window.
         Library items are dragged onto a zone's queue. -->
    <section class="page page-app" data-page="zones" data-title="common.zones">
      <section class="pane zones-pane" data-i18n-aria-label="common.zones">
        <div class="pane-bar">
          <button type="button" id="zonePrev" class="icon-only" data-i18n-aria-label="zones.previousZone" data-i18n-title="zones.previousZone"><i data-icon="back"></i></button>
          <span id="zoneMarker" class="zone-marker" aria-hidden="true"></span>
          <div id="zoneTabs" class="zone-tabs"></div>
          <button type="button" id="zoneNext" class="icon-only" data-i18n-aria-label="zones.nextZone" data-i18n-title="zones.nextZone"><i data-icon="forward"></i></button>
        </div>
        <div id="zones" class="zone-track"></div>
      </section>

      <button type="button" id="libraryToggle" class="library-toggle" aria-controls="browserPanel" aria-expanded="true" data-i18n-title="zones.hideLibrary">
        <i data-icon="forward"></i><span data-i18n="common.library"></span>
      </button>

      <section id="browserPanel" class="pane library-pane" data-i18n-aria-label="common.library">
        <div class="pane-bar">
          <button type="button" id="mbBack" class="icon-only" data-i18n-title="library.back" data-i18n-aria-label="library.back"><i data-icon="back"></i></button>
          <button type="button" id="mbForward" class="icon-only" data-i18n-title="library.forward" data-i18n-aria-label="library.forward"><i data-icon="forward"></i></button>
          <form id="mbSearch" class="mb-search">
            <input id="mbSearchQ" type="search" data-i18n-placeholder="library.searchTracksAlbums" data-i18n-aria-label="library.searchLibrary">
            <select id="mbSearchTypes" data-i18n-aria-label="library.searchFor" data-i18n-title="library.whatToSearch">
              <option value="all" data-i18n="library.allTypes"></option>
              <option value="tracks" data-i18n="library.tracks"></option>
              <option value="albums" data-i18n="common.albums"></option>
              <option value="artists" data-i18n="common.artists"></option>
              <option value="playlists" data-i18n="common.playlists"></option>
              <option value="stations" data-i18n="library.stations"></option>
            </select>
            <select id="mbSearchSource" data-i18n-aria-label="library.source" data-i18n-title="library.onlyWhatThis">
              <option value="" data-i18n="library.allSources"></option>
            </select>
            <select id="mbSearchMedia" data-i18n-aria-label="library.media" data-i18n-title="library.onlyTracksOf">
              <option value="" data-i18n="library.anyMedia"></option>
              <option value="music" data-i18n="library.music"></option>
              <option value="audiobook" data-i18n="library.audiobooks"></option>
              <option value="radio" data-i18n="library.radio"></option>
            </select>
            <button class="primary" data-i18n="library.search"></button>
          </form>
        </div>
        <div id="mb">
          <nav id="mbSources" class="small" data-i18n-aria-label="library.sources"></nav>
          <div id="mbView"><p class="muted" data-i18n="library.pickSourceOr"></p></div>
          <div id="mbBusy" class="mb-busy" role="status" data-i18n-aria-label="library.loading" hidden><span class="spin"></span></div>
        </div>
      </section>
    </section>

    <!-- Every client the core hears and every room the server knows, one row
         each; the gear opens the room's settings page (#/client/<id>). -->
    <section class="page" data-page="rooms" data-title="common.clients" hidden>
      <div class="page-heading with-tools">
        <div>
          <h1 data-i18n="common.clients"></h1>
          <p class="subtitle" data-i18n="clients.everyAudioClient"></p>
        </div>
        <span id="clientsNote" class="muted small"></span>
      </div>
      <div id="clients" class="table-wrap plain"></div>
    </section>

    <!-- One client's room settings, full page: #/client/<id>. -->
    <section class="page" data-page="client" data-title="nav.clientSettings" hidden>
      <a class="room-back" href="#/rooms"><i data-icon="back"></i><span data-i18n="common.clients"></span></a>
      <div id="rooms"></div>
    </section>


    <!-- As the Zones page: the playlists and their folders as a tree (slid
         away by its strip), the open playlist's entries, and the library
         (moved here from the Zones page while shown) on the right. -->
    <section class="page page-app" data-page="playlists" data-title="common.playlists" data-part="tree" hidden>
      <!-- On a small screen one part at a time, picked here (app.css hides it otherwise). -->
      <div class="pl-small-bar">
        <button type="button" id="plPartMenu" class="icon-only" aria-haspopup="menu" data-i18n-aria-label="playlists.switchView" data-i18n-title="playlists.switchView"><i data-icon="menu"></i></button>
        <div id="plPartPopover" class="pick-popover" popover="auto" role="menu" data-i18n-aria-label="common.show">
          <button type="button" data-part="tree"><i data-icon="folder"></i><span data-i18n="common.playlists"></span></button>
          <button type="button" data-part="list"><i data-icon="playlists"></i><span data-i18n="playlists.playlist"></span></button>
          <button type="button" data-part="library"><i data-icon="library"></i><span data-i18n="common.library"></span></button>
        </div>
        <span id="plPartLabel" class="pl-part-label" data-i18n="common.playlists"></span>
      </div>
      <section id="plTreePane" class="pane pl-tree-pane" data-i18n-aria-label="playlists.playlistsAndFolders">
        <div class="pane-bar">
          <span class="pane-title" data-i18n="common.playlists"></span>
          <button type="button" id="plNewFolder" class="icon-only" data-i18n-title="playlists.newFolder" data-i18n-aria-label="playlists.newFolder"><i data-icon="folder"></i></button>
          <button type="button" id="plNew" class="icon-only" data-i18n-title="playlists.newPlaylist" data-i18n-aria-label="playlists.newPlaylist"><i data-icon="plus"></i></button>
        </div>
        <div id="plTree" class="pl-tree"></div>
      </section>

      <button type="button" id="plTreeToggle" class="library-toggle tree-toggle" aria-controls="plTreePane" aria-expanded="true" data-i18n-title="playlists.hideTree">
        <i data-icon="back"></i><span data-i18n="common.playlists"></span>
      </button>

      <section class="pane list-pane" data-i18n-aria-label="playlists.playlist">
        <div id="plHead" class="queue-head"></div>
        <input type="search" id="plSearch" class="pane-search" data-i18n-placeholder="playlists.searchPlaylist" data-i18n-aria-label="playlists.searchPlaylist" autocomplete="off">
        <div id="entries" class="pl-entries"></div>
      </section>
    </section>

    <!-- As the Playlists page: the folders of the stations as a tree (slid
         away by its strip) and the stations of the folder picked in it. -->
    <section class="page page-app" data-page="stations" data-title="nav.radioStations" data-part="tree" hidden>
      <!-- On a small screen one part at a time, picked here (app.css hides it otherwise). -->
      <div class="pl-small-bar">
        <button type="button" class="icon-only" aria-haspopup="menu" data-i18n-aria-label="stations.switchView" data-i18n-title="stations.switchView"><i data-icon="menu"></i></button>
        <div class="pick-popover" popover="auto" role="menu" data-i18n-aria-label="common.show">
          <button type="button" data-part="tree"><i data-icon="folder"></i><span data-i18n="common.folders"></span></button>
          <button type="button" data-part="list"><i data-icon="radio"></i><span data-i18n="stations.stations"></span></button>
        </div>
        <span class="pl-part-label" data-i18n="common.folders"></span>
      </div>
      <section id="stTreePane" class="pane pl-tree-pane" data-i18n-aria-label="stations.stationFolders">
        <div class="pane-bar">
          <span class="pane-title" data-i18n="common.folders"></span>
          <button type="button" id="stNewFolder" class="icon-only" data-i18n-title="stations.newFolder" data-i18n-aria-label="stations.newFolder"><i data-icon="folder"></i></button>
        </div>
        <div id="stTree" class="pl-tree"></div>
      </section>

      <button type="button" id="stTreeToggle" class="library-toggle tree-toggle" aria-controls="stTreePane" aria-expanded="true" data-i18n-title="stations.hideTree">
        <i data-icon="back"></i><span data-i18n="common.folders"></span>
      </button>

      <section class="pane list-pane" data-i18n-aria-label="stations.stations">
        <div id="stHead" class="queue-head"></div>
        <input type="search" id="stSearch" class="pane-search" data-i18n-placeholder="stations.searchAllStations" data-i18n-aria-label="stations.searchAllStations" autocomplete="off">
        <div id="stations" class="pl-entries"></div>
      </section>

      <dialog id="stationDialog" class="confirm-dialog station-dialog" data-i18n-aria-label="stations.addStation">
        <div class="confirm-head"><span class="confirm-icon move-icon"><i data-icon="radio"></i></span><h2 data-i18n="stations.addStation"></h2></div>
        <form id="stationForm" class="fields">
          <label for="stName" data-i18n="stations.name"></label><input id="stName" name="name" required>
          <label for="stUrl" data-i18n="stations.streamUrl"></label><input id="stUrl" name="streamUrl" placeholder="http(s)://…" required>
          <label for="stHome" data-i18n="stations.homepage"></label><input id="stHome" name="homepage">
          <label for="stGenre" data-i18n="stations.genre"></label><input id="stGenre" name="genre">
          <label for="stLogo" data-i18n="stations.logoUrl"></label><input id="stLogo" name="logo">
          <p class="save-error" role="alert" hidden></p>
          <span></span><div class="confirm-buttons"><button type="button" data-close data-i18n="common.cancel"></button><button class="primary" data-i18n="stations.addStationButton"></button></div>
        </form>
      </dialog>
      <dialog id="importDialog" class="confirm-dialog station-dialog" data-i18n-aria-label="stations.importStations">
        <div class="confirm-head"><span class="confirm-icon move-icon"><i data-icon="playlists"></i></span><h2 data-i18n="stations.importStations"></h2></div>
        <form id="importForm" class="stack">
          <textarea name="playlist" rows="7" data-i18n-placeholder="stations.pasteM3uOr" data-i18n-aria-label="stations.m3uOrPls" required></textarea>
          <p class="save-error" role="alert" hidden></p>
          <div class="confirm-buttons"><button type="button" data-close data-i18n="common.cancel"></button><button class="primary" data-i18n="stations.import"></button></div>
        </form>
      </dialog>
    </section>

    <section class="page page-chat" data-page="assistant" data-title="nav.assistant" hidden>
      <aside class="chat-side" id="chatSide" data-i18n-aria-label="chat.chats">
        <div class="pane-bar">
          <strong class="grow" data-i18n="chat.chats"></strong>
          <button type="button" id="chatNew" class="icon-only" data-i18n-title="chat.newChat" data-i18n-aria-label="chat.newChat"><i data-icon="plus"></i></button>
        </div>
        <input type="search" id="chatSearch" data-i18n-placeholder="chat.searchChats" data-i18n-aria-label="chat.searchChats" autocomplete="off">
        <nav id="chatList" class="chat-list"></nav>
      </aside>
      <div class="chat-main">
        <div class="pane-bar chat-head">
          <button type="button" id="chatSideToggle" class="icon-only chat-side-toggle" aria-controls="chatSide" aria-expanded="false" data-i18n-aria-label="chat.showChats"><i data-icon="menu"></i></button>
          <h1 id="chatTitle" class="grow" data-i18n="chat.newChat"></h1>
          <button type="button" id="chatRename" class="icon-only" data-i18n-title="chat.renameChat" data-i18n-aria-label="chat.renameChat" hidden><i data-icon="edit"></i></button>
          <button type="button" id="chatDelete" class="icon-only" data-i18n-title="chat.deleteChat" data-i18n-aria-label="chat.deleteChat" hidden><i data-icon="trash"></i></button>
        </div>
        <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
        <form id="promptForm" class="chat-composer" autocomplete="off">
          <textarea name="text" rows="1" data-i18n-placeholder="chat.tellAssistantWhat" data-i18n-aria-label="chat.message"></textarea>
          <div class="chat-tools">
            <button type="button" id="chatModel" class="chat-pick" aria-haspopup="dialog" aria-controls="chatModelPop"><span id="chatModelLabel"></span></button>
            <div id="chatModelPop" class="model-popover" popover="auto" role="dialog" data-i18n-aria-label="chat.chooseModel">
              <input type="search" id="chatModelSearch" data-i18n-placeholder="chat.searchModels" data-i18n-aria-label="chat.searchModels" autocomplete="off">
              <div id="chatModelList" class="model-list" role="listbox" data-i18n-aria-label="chat.models"></div>
            </div>
            <select name="reasoning" data-i18n-aria-label="chat.reasoning" data-i18n-title="chat.reasoning"><option value="" data-i18n="chat.reasoningSettings"></option><option value="default" data-i18n="chat.reasoningVendorDefault"></option><option value="off" data-i18n="chat.reasoningOff"></option><option value="low" data-i18n="chat.reasoningLow"></option><option value="medium" data-i18n="chat.reasoningMedium"></option><option value="high" data-i18n="chat.reasoningHigh"></option></select>
            <span class="grow"></span>
            <button type="button" id="chatMic" class="icon-only chat-mic" data-i18n-title="chat.talkToGaldrun" data-i18n-aria-label="chat.talkToGaldrun" aria-pressed="false"><i data-icon="mic"></i></button>
            <button type="button" id="chatStop" class="icon-only" data-i18n-title="chat.stop" data-i18n-aria-label="chat.stop" hidden><i data-icon="stop"></i></button>
            <button id="chatSend" class="primary icon-only" data-i18n-title="chat.sendEnter" data-i18n-aria-label="chat.send"><i data-icon="forward"></i></button>
          </div>
        </form>
      </div>
    </section>

    <section class="page settings-page" data-page="listeners" data-title="nav.listeners" hidden>
      <div class="page-heading with-tools">
        <div>
          <h1 data-i18n="listeners.listeners"></h1>
          <p class="subtitle" data-i18n-html="listeners.peopleOfHouse"></p>
        </div>
        <button type="button" id="reloadListeners" data-i18n="common.reload"></button>
      </div>

      <div class="room-rows">
      <section class="room-row">
        <div class="room-row-intro"><div class="card-icon"><i data-icon="plus"></i></div><div><h2 data-i18n="listeners.addListener"></h2><p data-i18n="listeners.nameNoLogin"></p></div></div>
        <div class="room-row-content">
        <form id="userForm" class="row" autocomplete="off">
          <input name="name" data-i18n-placeholder="listeners.name1To" data-i18n-aria-label="listeners.newListenersName">
          <button class="primary" data-i18n="listeners.add"></button>
        </form>
        <p class="help" data-i18n-html="listeners.postUsersTrimmed"></p>
        </div>
      </section>
      <section class="room-row">
        <div class="room-row-intro"><div class="card-icon"><i data-icon="rooms"></i></div><div><h2 data-i18n="listeners.listeners"></h2><p data-i18n="listeners.everyoneLikeFavourite"></p></div></div>
        <div class="room-row-content">
        <div id="users" class="table-wrap plain"></div>
        </div>
      </section>
      <section class="room-row">
        <div class="room-row-intro"><div class="card-icon"><i data-icon="zones"></i></div><div><h2 data-i18n="listeners.whoListensWhere"></h2><p data-i18n="listeners.playsInZone"></p></div></div>
        <div class="room-row-content">
        <p class="help" data-i18n-html="listeners.patchZonesPlays"></p>
        <div id="zoneListeners" class="table-wrap plain"></div>
        </div>
      </section>
      </div>
