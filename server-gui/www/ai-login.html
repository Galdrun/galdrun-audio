<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title data-i18n="login.pageTitle"></title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="panel" style="margin: 16px">
  <h2 data-i18n="login.title"></h2>
  <pre id="out" class="json" data-i18n="login.finishingLogin"></pre>
  <p class="hint" data-i18n="login.serverguiReadsProviders"></p>
</main>
<script src="/assets/i18n.js"></script>
<script src="app.en.js"></script>
<script src="app.de.js"></script>
<script>
'use strict';
i18n.translate();
// Where the vendor returns (the ServerGui's phase 12): one call with the
// code, the server's answer shown as it is, and the ServerGui told. The code
// and state leave this page's URL first, so they stay out of the history.
(async () => {
  const query = new URLSearchParams(location.search);
  // ChatGPT names the client it registered for this installation (client_id).
  const state = query.get('state') ?? '', code = query.get('code'), error = query.get('error'), clientId = query.get('client_id');
  history.replaceState(null, '', location.pathname);
  const out = document.getElementById('out');
  // Opened by hand or reloaded: nothing came back from a vendor.
  if (!state || (!code && !error)) {
    out.className = 'json bad';
    out.textContent = tt('login.noLoginCame');
    return;
  }
  // A vendor's refusal goes to the callback, which drops the state and says so.
  const request = error
    ? fetch(`/api/v1/ai/login/callback?${new URLSearchParams({ state, error })}`)
    : fetch('/api/v1/ai/login/complete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ state, code: code ?? '', ...(clientId ? { clientId } : {}) }) });
  let status = 0, answer;
  try {
    const res = await request;
    status = res.status;
    const text = await res.text();
    try { answer = JSON.parse(text); } catch { answer = text; }
  } catch (e) {
    answer = { error: 'fetchFailed', message: String(e) };
  }
  const ok = status >= 200 && status < 300;
  out.className = 'json ' + (ok ? 'good' : 'bad');
  out.textContent = `${status || 'unreachable'}\n${JSON.stringify(answer, null, 2)}`;
  if ('BroadcastChannel' in window) {
    new BroadcastChannel('vx.ai').postMessage(ok
      ? { provider: answer.id }
      : { error: answer?.error ?? String(status), message: answer?.message ?? '' });
  }
})();
</script>
</body>
</html>
